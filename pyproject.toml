[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-strategies"
version = "0.1.0"
description = "Reference implementation and evaluation gates for RAG chunking, search, and index storage patterns"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
retrieval-lab = "retrieval_strategies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]